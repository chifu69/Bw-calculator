<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="description" content="Basis Weight and roll length calculator for 48-inch and 51-inch mandrels."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BW Calculator"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><title>BW & FT Calculator</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><header class="hero"><div class="brand-mark">BW</div><div><h1>BW & FT Calculator</h1><p>Basis Weight and Roll Length</p></div></header><main><section class="segmented"><button id="tab-bw" class="segment active" type="button">Calculate BW</button><button id="tab-ft" class="segment" type="button">Calculate FT</button></section><section id="panel-bw" class="panel active"><div class="card"><div class="field"><label>Mandrel</label><div class="choice-row"><button class="choice active" data-group="bw-mandrel" data-value="51" type="button">51&quot;</button><button class="choice" data-group="bw-mandrel" data-value="48" type="button">48&quot;</button></div><input id="bw-mandrel" type="hidden" value="51"></div><div class="field"><label for="bw-weight">Weight <span>lb</span></label><input id="bw-weight" inputmode="decimal" type="number" min="0" step="any" placeholder="Enter weight"></div><div class="field"><label for="bw-length">Length <span>ft</span></label><input id="bw-length" inputmode="decimal" type="number" min="0" step="any" placeholder="Enter length"></div><button id="calculate-bw" class="primary" type="button">Calculate BW</button><div id="bw-message" class="message"></div><div class="result-card"><div><span class="result-label">
